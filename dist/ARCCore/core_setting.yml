# 每日签到额外发放的公会贡献点（同时加本人私人贡献与公会公共贡献；未加入公会则跳过；0 表示关闭）
CHECKIN_GUILD_CONTRIBUTION_POINTS=100
# 每日从奖励池中按权重不放回随机抽取的条数区间（含端点）；例如 1～3 表示每天随机 1、2 或 3 条
