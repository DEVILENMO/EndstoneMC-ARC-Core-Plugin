SIDEBAR_ENABLE=True
SIDEBAR_DEFAULT_ON=True
SIDEBAR_TITLE=§6弧光服务器
# 可见页面数 >= 2 时自动翻页间隔（秒）
SIDEBAR_SWITCH_INTERVAL=10
# 刷新周期（tick，20=1秒）；影响时间/生命等内置变量的更新频率
SIDEBAR_REFRESH_TICKS=60
