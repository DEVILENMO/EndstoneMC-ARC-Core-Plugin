CHECKIN_TOP_RANK_BONUS_ITEM_COUNT=1
CHECKIN_TOP_RANK_BONUS_MONEY_STEP=200
# 连续签到金钱递增步长：总存款 = 基础签到存款 + (连续天数-1)*步长
