# 邀请奖励 [本服]：待领次数在跨服 player_basic_info；实际发放内容按玩家当前所在服的本配置
INVITE_REWARD_ITEM_NAME=minecraft:diamond
INVITE_REWARD_ITEM_COUNT=1
INVITE_REWARD_MONEY=0
INVITE_REWARD_FREE_LAND_BLOCKS=10

# 头衔系统 [全服]：默认头衔列表与 OP 头衔名（从服只读；需 SYNC_CLIENT_SYNC_TITLE）
# 聊天前显示佩戴的头衔，如 [管理员]玩家名: 消息
# 默认头衔（逗号分隔，所有玩家拥有）
DEFAULT_TITLE=见习冒险家
# OP 专属头衔（仅一个，仅 OP 拥有；非 OP 进服时若正佩戴则自动解除）
OP_TITLE=监察使

# 性能检测应急关服：为 True 时每 10 秒读取 Server.current_mspt，超过阈值则自动执行 stop 关服
ENABLE_MSPT_EMERGENCY_SHUTDOWN=True
# MSPT 上限（毫秒/刻），大于此值触发关服（默认 100）
MSPT_EMERGENCY_SHUTDOWN_LIMIT=200

# 全局爆炸拦截（默认开启）：True=取消一切爆炸事件；False=仅按领地 allow_explosion 保护
BLOCK_ALL_EXPLOSIONS=True

# 天眼系统（Sky Eye）：玩家行为审计，日志目录 plugins/ARCCore/sky_eye/YYYYMMDD.txt（交互、放置、破坏、死亡、进出服、对实体交互等）
ENABLE_SKY_EYE=True
# 是否记录玩家攻击生物/玩家的天眼日志（False 仍保留领地保护判定，适合高 PvE 服）
SKY_EYE_LOG_ACTOR_DAMAGE=True
# 按自然日保留日志的最长天数，更早日期的 .txt 会被删除；0 表示不自动删除旧文件
SKY_EYE_MAX_RETENTION_DAYS=7

# 公会 [全服]：下列创建/改名/升级费用与规模上限从服只读（需 SYNC_CLIENT_SYNC_GUILD）
# 创建公会费用（默认十万；本示例留空表示沿用插件内置默认，请按实际部署填写）
GUILD_CREATE_COST=
# 公会规模：每个公会有 small / medium / large 三档规模等级，新建公会默认 small
# 下列三个值为各等级的成员人数上限（含会长）；OP 可在「OP 面板 → 公会管理」中直接升级/降级公会规模（无消耗）
GUILD_SIZE_SMALL_MAX=10
GUILD_SIZE_MEDIUM_MAX=20
GUILD_SIZE_LARGE_MAX=40
# 公会升级规模消耗的「公会公共贡献点」（玩家通过完成小游戏等方式获得，并由 api_add_guild_contribution 累加）
# 会长 / 管理员可在「我的公会 → 升级公会规模」中花费公共贡献点升级；下列两个值为升级到对应等级的消耗
GUILD_UPGRADE_TO_MEDIUM_COST=10000
GUILD_UPGRADE_TO_LARGE_COST=100000
# 会长改名公会需支付的金钱 [全服]（0 表示免费）
GUILD_RENAME_COST=0
# 成员传送至公会领地消耗的个人贡献点 [本服]（0 表示免费；不从存款扣费）
GUILD_LAND_TELEPORT_CONTRIB_COST=10
# 击杀 → 公会贡献点比例 [本服]（搭配 kill_reward.txt 使用）
# 计算公式：贡献点 = floor(击杀金钱奖励 * 比例)；例如击杀奖励 10 元，比例 0.5，则获得 5 公会贡献点
# 仅当玩家已加入公会时生效；未加入公会则静默跳过；设为 0 关闭该功能
KILL_REWARD_GUILD_CONTRIB_RATIO=0.5

