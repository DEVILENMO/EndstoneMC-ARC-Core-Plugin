# =============================================================================
# ARCCore 配置文件示例
# 格式与 dist/ARCCore/core_setting.yml 一致：KEY=VALUE，按需复制到正式 core_setting.yml 使用
# =============================================================================

DEFAULT_LANGUAGE_CODE=ZH-CN
DATABASE_PATH=ARCCore.db

# =============================================================================
# 跨服数据同步（v0.9.43+，仅网络 SyncServer / SyncClient）
#
# 【同步的是数据表】由下方四个 SYNC_CLIENT_SYNC_* 开关控制（远程从服生效）：
#   SYNC_CLIENT_SYNC_PLAYER  → player_basic_info（账号、密码、邀请、总时长、once_op）
#   SYNC_CLIENT_SYNC_ECONOMY → player_economy（银行存款余额）
#   SYNC_CLIENT_SYNC_TITLE   → title_definitions / 解锁 / 佩戴
#   SYNC_CLIENT_SYNC_GUILD   → guilds / guild_members / guild_invites
# 不同步：player_local_info（本服 OP、签到记录、免费圈地格）、领地、Home、天眼等
#
# 【全服规则 [全服]】仅同步中心（ENABLE_SYNC_SERVER=True）可改；从服只读，连接后按
# 已开启的数据开关下发并覆盖本机 yml。OP 面板中带 [全服] 标记：
#   经济（需 SYNC_CLIENT_SYNC_ECONOMY）：PLAYER_INIT_MONEY_NUM、HIDE_OP_IN_MONEY_RANKING、RICHEST_TITLE_NAME
#   头衔（需 SYNC_CLIENT_SYNC_TITLE）：DEFAULT_TITLE、OP_TITLE
#   公会（需 SYNC_CLIENT_SYNC_GUILD）：GUILD_CREATE_COST、GUILD_RENAME_COST、GUILD_UPGRADE_*、GUILD_SIZE_*
#
# 【本服玩法 [本服]】永远只读本机 yml，中心不会覆盖（各服可不同）：
#   签到金钱/物品、邀请奖励、传送费、领地价、小喇叭、击杀公会贡献、公会领地传送消耗等
#
# 推荐拓扑：同步中心 ENABLE_SYNC_SERVER=True + ENABLE_SYNC_CLIENT=False；
#           从服 ENABLE_SYNC_CLIENT=True，填写 SYNC_SERVER_IP / SYNC_CLIENT_PORT
# =============================================================================

# ----- 同步中心（可选；通常仅在一台机器或主库服开启） -----
ENABLE_SYNC_SERVER=False
SYNC_SERVER_PORT=19999
SYNC_SERVER_AUTH_KEY=

# ----- 远程客户端同步（子服） -----
ENABLE_SYNC_CLIENT=False
SYNC_SERVER_IP=127.0.0.1
SYNC_CLIENT_PORT=19999
SYNC_CLIENT_SERVER_ID=server_001
SYNC_CLIENT_SERVER_NAME=服务器01
SYNC_CLIENT_AUTH_KEY=
# 同步中心不可达或断线后的重连间隔（秒，默认 10）
SYNC_CLIENT_RECONNECT_INTERVAL=10
# 分项同步开关（仅远程从服；关闭的类别不拉取/推送对应数据表）
# 注意：开关只控制「数据表」，不会把签到/传送/领地等本服玩法配置同步过来
SYNC_CLIENT_SYNC_PLAYER=True
SYNC_CLIENT_SYNC_ECONOMY=True
SYNC_CLIENT_SYNC_TITLE=True
SYNC_CLIENT_SYNC_GUILD=True
# 条件头衔（首富等）是否由本机计算。主服/同步中心留 True；远程从服建议 False。
# 留空则自动推断：远程客户端=否；其余=是。
CONDITIONAL_TITLE_AUTHORITY=

# 强制登录（为 True 时，玩家进入游戏强制打开 /arc 菜单登录或注册；关闭登录/注册界面且未正确输入密码时会再次强制打开）
FORCE_LOGIN=True

# 玩家经济 [全服]：新号初始存款、排行榜隐藏 OP、首富头衔名（从服只读；需 SYNC_CLIENT_SYNC_ECONOMY）
# 也可在 OP 面板 → 配置文件设置 → 经济 中修改（同步中心上可改，从服只读）
PLAYER_INIT_MONEY_NUM=2000
HIDE_OP_IN_MONEY_RANKING=True
RICHEST_TITLE_NAME=首富

# 出生点保护
IF_PROTECT_SPAWN=False
SPAWN_PROTECT_RANGE=8

# 领地设置 [本服]：单价、退税、圈地开关等均各服独立，不随同步中心覆盖
# 领地系统总开关；False 时不启位置追踪线程（无进出领地提示），方块保护等事件逻辑仍生效
ENABLE_LAND_SYSTEM=True
# 是否允许圈地（新建私人/公会/公共领地）；[本服] 各服独立
ALLOW_LAND_CLAIM=True
MIN_LAND_DISTANCE=1
LAND_PRICE=50
LAND_SELL_REFUND_COEFFICIENT=0.9
# 私人领地上架成交：成交价高于买入价（owner_paid_money）时，对差额按此比例征收增值税（0～1，默认 0.1 即 10%）；0 为关闭
LAND_SALE_VAT_RATE=0.1
LAND_MIN_SIZE=5
DEFAULT_FREE_LAND_BLOCKS=1500
# 仅允许在领地内放置的方块（逗号分隔方块 ID）；列表中的方块无法在荒野放置；在领地内需为拥有者或授权玩家（与既有建造权限一致）。留空表示不限制
LAND_ONLY_PLACE_BLOCKS=minecraft:beacon,minecraft:spawner,lfg_ff:structure_placer_block,minecraft:wither_skeleton_skull
# 全局禁用方块（逗号分隔方块 ID）；列表中的方块对非 OP 玩家禁止放置和交互，OP 直接跳过检查。留空表示不限制
DISABLED_BLOCKS=minecraft:hopper,minecraft:observer
# 公共领地内白名单保护生物（逗号分隔，在此列表中的生物在公共领地内不可被伤害）
PUBLIC_LAND_PROTECTED_ENTITIES=minecraft:villager_v2,minecraft:iron_golem,minecraft:snow_golem
# 公共领地拦截生物生成模式：whitelist=白名单（名单上的不拦截，空名单则拦截全部）；blacklist=黑名单（只拦截名单上的）
# 各公共领地在 OP 公共领地设置中单独开关拦截；旧配置 False/off 视为 whitelist
PUBLIC_LAND_BLOCK_ACTOR_SPAWN_MODE=whitelist
# 拦截生物生成作用范围：public=仅公共领地（看各领地开关，默认）；all=任意领地（私人/公会/公共均按名单拦截，不看各领地开关）
LAND_BLOCK_ACTOR_SPAWN_SCOPE=public
# 公共领地拦截生物生成名单（逗号分隔实体 ID）。白名单时名单上的不拦截；黑名单时只拦截名单上的
# 支持命名空间前缀：oreville_wb: 或 oreville_wb:* 可匹配该命名空间下全部实体
PUBLIC_LAND_BLOCK_ACTOR_SPAWN_LIST=
# 公共领地禁止交互的方块（开启了允许方块交互前提下）
PUBLIC_LAND_INTERACT_BLOCK_BLACKLIST=minecraft:frame,minecraft:glow_frame,minecraft:oak_shelf,minecraft:spruce_shelf,minecraft:birch_shelf,minecraft:jungle_shelf,minecraft:acacia_shelf,minecraft:dark_oak_shelf,minecraft:mangrove_shelf,minecraft:cherry_shelf,minecraft:pale_oak_shelf,minecraft:bamboo_shelf,minecraft:crimson_shelf,minecraft:warped_shelf

# 广播间隔
BROADCAST_INTERVAL=120
# 游戏内死亡播报（True/False，默认 True；枪战服可关，改用模式内击杀播报）
ENABLE_DEATH_BROADCAST=True
# 群聊死亡播报：off=不播报 / pvp=仅播报PvP死亡 / all=全部播报（默认）
QQ_DEATH_BROADCAST_MODE=all
# 小喇叭每小时费用（玩家购买后每10分钟广播一次，按小时计费）
SMALL_HORN_PRICE_PER_HOUR=60

# 清道夫
ENABLE_CLEANER=False
CLEANER_INTERVAL=300

# 传送系统设置
MAX_PLAYER_HOME_NUM=10
# 传送系统面板各项开关（默认全开；关闭后主菜单传送面板不显示对应按钮）
ENABLE_TELEPORT_PUBLIC_WARP=True
ENABLE_TELEPORT_HOME=True
ENABLE_RANDOM_TELEPORT=true
ENABLE_TELEPORT_DEATH_LOCATION=True
ENABLE_TELEPORT_PLAYER=True
ENABLE_TELEPORT_CROSS_SERVER=True
RANDOM_TELEPORT_CENTER_X=0
RANDOM_TELEPORT_CENTER_Z=0
RANDOM_TELEPORT_RADIUS=4096

# 传送收费配置 [本服]：各服可设不同价格（0 表示免费）
TELEPORT_COST_PUBLIC_WARP=50
TELEPORT_COST_HOME=200
TELEPORT_COST_LAND=0
TELEPORT_COST_DEATH_LOCATION=500
TELEPORT_COST_RANDOM=1000
TELEPORT_COST_PLAYER=100

# 每日签到 [本服]：金钱、物品池、前排奖励、连续签到、签到公会贡献均各服独立（签到记录在 player_local_info）
CHECKIN_DAILY_MONEY=1000.0
